<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Placeholder or image styling for the cute cat */
        .cat-graphic {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #b33951;
            font-size: 2.5rem;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .heart {
            color: #ff4d6d;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 40px;
            min-height: 60px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background-color: #7cd1a1;
        }

        #noBtn {
            background-color: #f27474;
            position: absolute;
            /* Initially positioned on the right side of the gap center */
            left: calc(50% + 20px);
        }
    </style>
</head>

        <h1 id="question">Do you love me? <span class="heart">❤️</span></h1>

        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');

        // Function to move the "NO" button away randomly when targeted
        function escapeButton() {
            // Calculated bounded limits so the button doesn't fly entirely off the visible screen
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            // Change style to fixed or absolute top-level coordinates to jump around smoothly
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Triggers the escape mechanism on both hover (desktop) and touch (mobile)
        noBtn.addEventListener('mouseover', escapeButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents clicking action on tap
            escapeButton();
        });

        // Action when "YES" is clicked
        function celebrate() {
            question.innerHTML = "I love you too! 🥰❤️";
            noBtn.style.display = 'none'; // Remove the elusive no button completely
            yesBtn.style.transform = 'scale(1.2)';
            yesBtn.disabled = true;
        }
    </script>
